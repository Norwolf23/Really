name: Really
options:
  bundleIdPrefix: studio.nickson
  deploymentTarget:
    iOS: "17.0"
settingGroups:
  signing:
    DEVELOPMENT_TEAM: 6272CRNH9G
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.3"
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "5.0"
targetTemplates:
  Extension:
    type: app-extension
    platform: iOS
    sources:
      - Sources/Shared
      - Resources
    entitlements:
      path: Extensions/${target_name}.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.studio.nickson.really]
    settings:
      groups: [signing]
targets:
  Really:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
      - Assets.xcassets
    dependencies:
      - target: ShieldConfig
      - target: ShieldAction
      - target: Monitor
    entitlements:
      path: Really.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.studio.nickson.really]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "Really?"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "© 2026 Nickson Studio"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
    settings:
      groups: [signing]
      base:
        PRODUCT_NAME: Really
        PRODUCT_BUNDLE_IDENTIFIER: studio.nickson.really
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ShieldConfig:
    templates: [Extension]
    sources:
      - Extensions/ShieldConfigurationExtension.swift
    info:
      path: Extensions/ShieldConfig-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.nickson.really.shield-config
  ShieldAction:
    templates: [Extension]
    sources:
      - Extensions/ShieldActionExtension.swift
    info:
      path: Extensions/ShieldAction-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.nickson.really.shield-action
  Monitor:
    templates: [Extension]
    sources:
      - Extensions/MonitorExtension.swift
    info:
      path: Extensions/Monitor-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MonitorExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.nickson.really.monitor
  ReallyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Really
    settings:
      groups: [signing]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.nickson.really.tests
schemes:
  Really:
    build:
      targets:
        Really: all
        ReallyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ReallyTests
